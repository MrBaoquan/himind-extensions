<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>开源热榜 · 历史归档</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">📡</span>
        <div class="brand-text">
          <strong>开源热榜</strong>
          <small>按日期归档，期内按采集组阅读</small>
        </div>
      </div>
      <div class="toolbar">
        <button id="refresh" class="btn" type="button">刷新</button>
      </div>
    </header>



    <p class="notice" id="notice" hidden></p>

    <main class="layout">
      <aside class="rail">
        <div class="rail-head">
          <strong>归档期次</strong>
          <span id="archive-count" class="pill">—</span>
        </div>
        <ul id="archive-list" class="archive-list" aria-label="归档期次"></ul>
        <p class="rail-foot" id="data-root" title=""></p>
      </aside>

      <section class="detail">
        <div class="detail-head">
          <div>
            <h1 id="detail-title">选择一期报告</h1>
            <p id="detail-subtitle">左侧按期次浏览每日采集结果与解读。</p>
          </div>
          <div class="detail-tools">
            <span id="detail-badges" class="badges"></span>
          </div>
        </div>
        <div class="period-groups" id="group-switcher" role="tablist" aria-label="本期采集组" hidden></div>
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="ranking" role="tab" type="button">榜单</button>
          <button class="tab" data-tab="summary" role="tab" type="button">摘要</button>
          <button class="tab" data-tab="source" role="tab" type="button">网页原稿</button>
        </div>
        <div class="panel">
          <section id="panel-ranking" class="panel-body"></section>
          <section id="panel-summary" class="panel-body" hidden></section>
          <section id="panel-source" class="panel-body" hidden></section>
        </div>
      </section>
    </main>


    <script src="app.js"></script>
  </body>
</html>
