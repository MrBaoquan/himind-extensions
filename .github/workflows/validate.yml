name: Validate extensions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Test plugins and tooling
        run: go test ./...
      - name: Validate extension catalog
        run: go run ./tools/cmd/himind-repo-check
