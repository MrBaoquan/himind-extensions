name: Release extension

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Extension kind
        required: true
        type: choice
        options:
          - plugin
          - skill
      path:
        description: Repository path, for example plugins/document-inspector
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: himind-extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
          cache: false
      - name: Validate repository
        shell: pwsh
        run: |
          go test ./...
          go run ./tools/cmd/himind-repo-check
      - name: Resolve source commit
        id: source
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw 'Unable to resolve the checked-out source commit.' }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build immutable package
        id: package
        shell: pwsh
        run: ./tools/release/build-extension.ps1 -Kind '${{ inputs.kind }}' -ExtensionPath '${{ inputs.path }}' -OutputDirectory dist
      - name: Inspect existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $result = gh release view '${{ steps.package.outputs.release_tag }}' --repo '${{ github.repository }}' --json targetCommitish 2>&1
          if ($LASTEXITCODE -ne 0) {
            if (($result -join "`n") -notmatch '(?i)(HTTP 404|release not found)') { throw ($result -join "`n") }
            'exists=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $release = ($result -join "`n") | ConvertFrom-Json
          if ([string]$release.targetCommitish -ne '${{ steps.source.outputs.commit }}') {
            throw 'This extension version already belongs to another source commit. Increase the extension version, or run Repair extension catalog for the original release.'
          }
          'exists=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Prepare signing key
        if: steps.release.outputs.exists != 'true'
        id: signing
        env:
          SIGNING_KEY_B64: ${{ secrets.HIMIND_EXTENSION_SIGNING_PRIVATE_KEY_PEM_B64 }}
          SIGNING_KEY_ID: ${{ vars.HIMIND_EXTENSION_SIGNING_KEY_ID }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY_B64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_KEY_ID)) { throw 'Extension signing credentials are not configured.' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'himind-extension-signing.pem'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:SIGNING_KEY_B64))
          "key_path=$keyPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Sign package
        if: steps.release.outputs.exists != 'true'
        id: signature
        env:
          SIGNING_KEY_ID: ${{ vars.HIMIND_EXTENSION_SIGNING_KEY_ID }}
        shell: pwsh
        run: |
          $metadata = '${{ steps.package.outputs.artifact_path }}.signature.json'
          ./tools/release/sign-extension.ps1 -ArtifactPath '${{ steps.package.outputs.artifact_path }}' -PrivateKeyPath '${{ steps.signing.outputs.key_path }}' -KeyId $env:SIGNING_KEY_ID -OutputPath $metadata
          "metadata_path=$metadata" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Publish GitHub Release
        if: steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.release_tag }}
          name: ${{ steps.package.outputs.extension_id }} v${{ steps.package.outputs.version }}
          target_commitish: ${{ steps.source.outputs.commit }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.signature.outputs.metadata_path }}
      - name: Resolve immutable release assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $artifact = '${{ steps.package.outputs.artifact_path }}'
          $signature = '${{ steps.signature.outputs.metadata_path }}'
          if ('${{ steps.release.outputs.exists }}' -eq 'true') {
            $downloadRoot = Join-Path $env:RUNNER_TEMP 'himind-existing-release'
            New-Item -ItemType Directory -Force -Path $downloadRoot | Out-Null
            gh release download '${{ steps.package.outputs.release_tag }}' --repo '${{ github.repository }}' --dir $downloadRoot --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Unable to download the existing immutable release.' }
            $artifact = Join-Path $downloadRoot '${{ steps.package.outputs.artifact_name }}'
            $signature = "$artifact.signature.json"
          }
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw "Release artifact was not found: $artifact" }
          if (-not (Test-Path -LiteralPath $signature -PathType Leaf)) { throw "Release signature metadata was not found: $signature" }
          $release = gh release view '${{ steps.package.outputs.release_tag }}' --repo '${{ github.repository }}' --json publishedAt | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace([string]$release.publishedAt)) { throw 'Unable to resolve the release publication time.' }
          "artifact_path=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signature_path=$signature" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "published_at=$($release.publishedAt)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Update public catalog
        shell: pwsh
        run: |
          go run ./tools/cmd/himind-catalog-upsert `
            -kind '${{ inputs.kind }}' `
            -source '${{ inputs.path }}' `
            -artifact '${{ steps.assets.outputs.artifact_path }}' `
            -signature '${{ steps.assets.outputs.signature_path }}' `
            -repository '${{ github.repository }}' `
            -tag '${{ steps.package.outputs.release_tag }}' `
            -generation '${{ steps.source.outputs.commit }}-${{ steps.package.outputs.release_tag }}' `
            -published-at '${{ steps.assets.outputs.published_at }}' `
            -catalog '.himind/catalog.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .himind/catalog.json
          git diff --cached --quiet -- .himind/catalog.json
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Catalog already contains this immutable release.'
            exit 0
          }
          git commit -m 'catalog: publish ${{ steps.package.outputs.extension_id }} v${{ steps.package.outputs.version }}'
          git push origin HEAD:main
      - name: Remove signing key
        if: always()
        shell: pwsh
        run: |
          $path = '${{ steps.signing.outputs.key_path }}'
          if ($path -and (Test-Path -LiteralPath $path)) { Remove-Item -LiteralPath $path -Force }
